name: Run Tests

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    timeout-minutes: 20
    runs-on: ubuntu-24.04

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - uses: astral-sh/setup-uv@v9.0.0
        with:
          version: "0.13.7"
          enable-cache: true

      - name: Install Python version for uv
        run: uv python install "3.12"

      - name: Install locked test environment
        run: uv sync --locked --extra test --extra endpoint
        env:
          UV_PYTHON: "3.12"

      - name: Resolve optional extras from binary wheels
        run: >-
          uv pip compile pyproject.toml --extra pdf --extra endpoint
          --only-binary :all:
          --output-file "${{ runner.temp }}/arxiv-extras.txt"
        env:
          UV_PYTHON: "3.12"

      - name: Run tests
        run: uv run pytest --cov-report=xml
        env:
          UV_PYTHON: "3.12"

      - name: Build candidate wheel
        run: uv build --wheel --out-dir dist
        env:
          UV_PYTHON: "3.12"

      - name: Smoke-test installed wheel over MCP
        run: uv run python scripts/smoke_installed_wheel.py
        env:
          UV_PYTHON: "3.12"

  docker-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Build image
        run: docker build --tag arxiv-mcp-server:ci .

      - name: Verify installed package
        run: |
          docker run --rm --entrypoint python arxiv-mcp-server:ci -c \
            "import importlib.metadata; print(importlib.metadata.version('arxiv-mcp-server'))"
